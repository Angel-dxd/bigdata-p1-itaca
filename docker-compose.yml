services:
  mongo:
    image: mongo:7
    container_name: bigdata-mongo
    ports:
      - "27017:27017"
    environment:
      - MONGO_INITDB_ROOT_USERNAME=admin
      - MONGO_INITDB_ROOT_PASSWORD=${MONGO_PASSWORD}
    volumes:
      - mongo-data:/data/db
    networks:
      - bigdata-net

  mongo-express:
    image: mongo-express:1
    container_name: bigdata-mongo-express
    ports:
      - "8082:8081"
    environment:
      - ME_CONFIG_MONGODB_ADMINUSERNAME=admin
      - ME_CONFIG_MONGODB_ADMINPASSWORD=${MONGO_PASSWORD}
      - ME_CONFIG_MONGODB_URL=mongodb://admin:${MONGO_PASSWORD}@mongo:27017/
      - ME_CONFIG_MONGODB_ENABLE_ADMIN=true
    depends_on:
      - mongo
    networks:
      - bigdata-net

volumes:
  mongo-data:

networks:
  bigdata-net:
    driver: bridge
